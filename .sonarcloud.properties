# Configuración del análisis automático de SonarCloud (el CI no corre un scanner propio, así que
# este es el archivo que se lee; sonar-project.properties no aplica).
#
# Duplicación: no cuentan los diccionarios de textos de cada pantalla (*Texts.ts: el mismo objeto
# en es/en/fr/pt, que solo cambia el texto), los JSON de idiomas ni las pruebas.
sonar.cpd.exclusions=src/**/constants/*Texts.ts,src/app/config/locales/**,src/**/*.test.ts,src/**/*.test.tsx
