# Revisa los tipos de TypeScript y corre las pruebas (jest-expo) en cada push o pull request a develop/main.
# El APK se sigue generando con EAS (eas build); aquí solo se valida el código.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Revisar tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit -p .

      # F-01: validadores y servicios de reserva, pago y login
      - name: Pruebas
        run: npm test -- --ci
